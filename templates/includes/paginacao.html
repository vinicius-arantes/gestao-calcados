{% if is_paginated %}
<nav aria-label="Paginação" class="mt-3">
  <ul class="pagination justify-content-center flex-wrap">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}" aria-label="Anterior">&laquo;</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}" aria-label="Próxima">&raquo;</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
