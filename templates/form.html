{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header"><h1 class="h5 mb-0">{{ titulo }}</h1></div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'includes/erros_form.html' %}
          {% for campo in form %}{% include 'includes/campo.html' %}{% endfor %}
          <div class="d-flex gap-2 justify-content-end">
            <a href="{{ url_cancelar }}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
